# Windows Authentication: run Java as your normal Windows user.
# Use the actual SQL Server TCP port. LocalDB does not expose a TCP port.
# Restore MovieWeb.bak into SQL Server 2025 (17.x) or newer first.
# Native auth DLL must be on java.library.path (the included launcher handles it).
db.url=jdbc:sqlserver://localhost:1433;databaseName=MovieWeb;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true;
