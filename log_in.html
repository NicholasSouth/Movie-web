<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Movie Website</title>

    <link rel="stylesheet"
          href="styles/log_in.css">
</head>


<body>

    <main class="login-page">

        <div class="login-container">


            <!-- =========================
                 Website Name
                 ========================= -->

            <a href="main.html"
               class="website-name">

                Movie Website

            </a>


            <!-- =========================
                 Login Header
                 ========================= -->

            <h1 class="login-title">

                Welcome Back

            </h1>


            <p class="login-subtitle">

                Sign in to continue to Movie Website

            </p>


            <!-- =========================
                 Login Form
                 ========================= -->

            <form class="login-form">


                <!-- Email or Phone Number -->

                <div class="input-group">

                    <label for="login">

                        Email or Phone Number

                    </label>


                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Enter your email or phone number"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- =========================
                     Login Options
                     ========================= -->

                <div class="login-options">


                    <!-- Remember Me -->

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <!-- Forgot Password -->

                    <a
                        href="#"
                        class="forgot-password"
                    >

                        Forgot password?

                    </a>

                </div>


                <!-- =========================
                     Login Button
                     ========================= -->

                <button
                    type="submit"
                    class="login-button"
                >

                    Login

                </button>

            </form>


            <!-- =========================
                 Administrator
                 ========================= -->

            <div class="administrator-section">


                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>


                <!--
                    Administrator button

                    href="#" means it does not
                    redirect to another page.
                -->

                <a
                    href="#"
                    class="administrator-button"
                >

                    Administrator

                </a>

            </div>


            <!-- =========================
                 Register
                 ========================= -->

            <p class="register-text">

                Don't have an account?

                <a
                    href="#"
                    class="register-link"
                >

                    Sign up

                </a>

            </p>


        </div>

    </main>


</body>

</html>
